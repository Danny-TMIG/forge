[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "Decentralized, autonomous infrastructure fabric with zero-trust architectural invariants"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "zeroconf>=0.130.0",
    "mlx>=0.0.0",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools]
packages = ["forge", "forge.hubs", "trust"]
