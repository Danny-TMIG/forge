[project]
name = "forge"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115","uvicorn[standard]>=0.30","httpx>=0.27","zeroconf>=0.132","typer>=0.12","rich>=13.7"]
[project.scripts]
forge = "forge.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["forge"]
